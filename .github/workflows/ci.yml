name: CI

on:
  push:
    branches: [develop, main, "mvp/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spotaxis
          POSTGRES_PASSWORD: spotaxis
          POSTGRES_DB: spotaxis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spotaxis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://spotaxis:spotaxis@localhost:5432/spotaxis
      SECRET_KEY: ci-only-secret-key
      DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install native libraries for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libfontconfig1 libcairo2 libgdk-pixbuf-2.0-0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.8"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Django checks
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
      - name: Tests
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
