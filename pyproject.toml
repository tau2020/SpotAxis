[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spotaxis"
version = "0.2.0"
description = "SpotAxis applicant tracking system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Framework and runtime
    "django>=5.2.1,<5.3",
    "dj-database-url>=2.3",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.1",
    "whitenoise>=6.9",
    "gunicorn>=23.0",
    "argon2-cffi>=23.1",
    "sentry-sdk[django]>=2.29",
    # Django add-ons still used by the existing apps
    "django-extensions>=4.1",
    "django-nested-formset>=0.1.4",
    "django-phonenumber-field>=8.1.0",
    "phonenumbers>=9.0.7",
    "validate-email>=1.3",
    "hashids>=1.3.1",
    "six>=1.17.0",
    # Files, documents and parsing
    "pillow>=11.2.1",
    "weasyprint>=65.1",
    "pdfminer-six>=20250506",
    "pypdf>=5.5.0",
    "python-docx>=1.1.2",
    "mammoth>=1.9.1",
    "striprtf>=0.0.29",
    "beautifulsoup4>=4.13.4",
    "unidecode>=1.4.0",
    "dicttoxml>=1.7.16",
    "datefinder>=0.7.3",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.32.3",
    "nh3>=0.2.21",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pytest>=8.3",
    "pytest-django>=4.11",
    "pre-commit>=4.2",
]

[tool.setuptools]
packages = [
    "TRM",
    "core",
    "activities",
    "candidates",
    "ckeditor",
    "common",
    "companies",
    "customField",
    "payments",
    "resume_parser",
    "scheduler",
    "upload_logos",
    "vacancies",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "TRM.settings"
python_files = ["test_*.py", "tests.py"]
testpaths = ["core", "common", "companies", "candidates", "vacancies", "activities", "customField", "scheduler", "payments"]
addopts = "--reuse-db -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations", "TRM/static", ".venv"]

[tool.ruff.lint]
# Start with a deliberately small, high-signal rule set; the legacy code has
# thousands of style issues that are not worth a big-bang reformat.
select = ["E9", "F63", "F7", "F82", "F401", "F811", "B008", "S102", "S307"]
ignore = []
per-file-ignores = { "**/__init__.py" = ["F401"], "TRM/settings.py" = ["F401"] }
